<style>
@property --r { syntax: '<length>'; inherits: true; initial-value: 0px; }

:root {
  color-scheme: dark;
  --bg: #0c1226;
  --card: #131b36;
  --line: rgba(255, 255, 255, .09);
  --text: #eef1f8;
  --muted: #a1aac4;
  --accent: #f4a62a;
  --accent-ink: #f4a62a;
  --accent-btn: #f4a62a;
  --accent-btn-text: #1a1204;
  --teal-ink: #5cc9b7;
  --teal-btn: #3fb5a3;
  --teal-btn-text: #08101f;
  --shadow: 0 14px 34px rgba(0, 0, 0, .38);
  --radius: 14px;
  --header-h: 64px;
  --font-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f4ec;
  --card: #ffffff;
  --line: rgba(23, 27, 44, .1);
  --text: #171b2c;
  --muted: #566077;
  --accent: #c62d2d;          /* red (was amber) */
  --accent-ink: #b3261e;
  --accent-btn: #c8302b;
  --accent-btn-text: #ffffff;
  --teal-ink: #1d4ed8;        /* blue (was teal) */
  --teal-btn: #1d4ed8;
  --teal-btn-text: #ffffff;
  --shadow: 0 14px 34px rgba(23, 27, 44, .09);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.65;
  transition: background-color .3s ease, color .3s ease;
  overflow-x: hidden;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.container { width: min(1120px, 100% - 40px); margin-inline: auto; }
section { padding: 84px 0 0; scroll-margin-top: var(--header-h); }
section:last-of-type { padding-bottom: 84px; }

.eyebrow {
  font-family: var(--font-mono);
  font-size: .78rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent-ink);
  margin-bottom: .5rem;
}
.section-title { font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 700; margin-bottom: 2rem; }

/* ---------- Header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 50;
  height: var(--header-h);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 100%; }
.logo { font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; color: var(--accent); letter-spacing: .02em; }
.header-actions { display: flex; align-items: center; gap: .6rem; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--card);
  display: grid; place-items: center; cursor: pointer;
  transition: transform .2s ease, border-color .2s ease;
}
.icon-btn:hover { border-color: var(--accent); }
.icon-btn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[data-theme="dark"] .icon-sun, [data-theme="light"] .icon-moon { display: none; }
.icon-sun { color: var(--accent); }
.menu-btn { border: 0; background: transparent; width: 40px; }
.menu-btn svg { width: 26px; height: 26px; }
.menu-btn .bar { transition: transform .25s ease, opacity .2s ease; transform-origin: center; }
.menu-btn[aria-expanded="true"] .bar-1 { transform: translateY(6px) rotate(45deg); }
.menu-btn[aria-expanded="true"] .bar-2 { opacity: 0; }
.menu-btn[aria-expanded="true"] .bar-3 { transform: translateY(-6px) rotate(-45deg); }

.nav {
  position: absolute; top: var(--header-h); left: 0; right: 0;
  display: none; flex-direction: column;
  padding: .4rem 20px 1.1rem;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.nav.open { display: flex; }
.nav a { padding: .8rem 0; font-weight: 500; border-bottom: 1px solid var(--line); }
.nav a:last-child { border-bottom: 0; }
.nav a:hover, .nav a.active { color: var(--accent-ink); }

/* ---------- Buttons & pills ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: .8rem 1.5rem; border-radius: 10px;
  font-weight: 600; font-size: .98rem; cursor: pointer;
  border: 1px solid transparent;
  transition: transform .18s ease, filter .18s ease, border-color .18s ease;
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
.btn-accent { background: var(--accent-btn); color: var(--accent-btn-text); }
.btn-teal { background: var(--teal-btn); color: var(--teal-btn-text); }
.btn-outline { background: transparent; border-color: var(--line); color: var(--text); }
.btn-outline:hover { border-color: var(--accent); }

.pill {
  display: inline-flex; align-items: center; gap: .65rem;
  padding: .5rem 1.1rem; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card);
  font-family: var(--font-mono); font-size: .85rem; line-height: 1.4;
}
.dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; flex: none; animation: pulse 2s ease-out infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, .55); }
  100% { box-shadow: 0 0 0 9px rgba(34, 197, 94, 0); }
}

/* ---------- Hero ---------- */
.hero { padding-top: 64px; padding-bottom: 20px; min-height: calc(100svh - var(--header-h)); display: flex; align-items: center; }
.hero-grid { display: grid; gap: 2.4rem; justify-items: center; text-align: center; }
.hero-copy { display: flex; flex-direction: column; align-items: center; gap: 1.1rem; }
.hero h1 { font-size: clamp(2.2rem, 8.5vw, 3.6rem); font-weight: 700; letter-spacing: -.01em; }
.hero h1 .name { color: var(--accent); display: inline-block; }
.role-line { font-family: var(--font-mono); color: var(--teal-ink); font-size: clamp(1.05rem, 3.6vw, 1.35rem); min-height: 1.9em; }
.cursor { display: inline-block; width: 2px; height: 1.1em; margin-left: 3px; vertical-align: -.15em; background: var(--teal-ink); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.hero-text { color: var(--muted); max-width: 34rem; font-size: 1.08rem; }
.hero-actions { display: flex; flex-direction: column; align-items: center; gap: .8rem; margin-top: .6rem; }

.hero-photo {
  --mx: -300px; --my: -300px; --r: 0px;
  position: relative; width: min(100%, 330px); aspect-ratio: 4 / 5;
  border-radius: 22px; overflow: hidden;
  border: 1px solid var(--line); box-shadow: var(--shadow);
  cursor: crosshair; touch-action: pan-y; user-select: none; -webkit-user-select: none;
  transition: --r .35s ease;
}
.hero-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; -webkit-user-drag: none; pointer-events: none; }
.hero-photo .photo-top {
  -webkit-mask-image: radial-gradient(circle calc(var(--r) + .1px) at var(--mx) var(--my), transparent 0, transparent 62%, #000 100%);
          mask-image: radial-gradient(circle calc(var(--r) + .1px) at var(--mx) var(--my), transparent 0, transparent 62%, #000 100%);
}
.hero-photo.is-active { --r: 92px; }

/* ---------- About ---------- */
.about-grid { display: grid; gap: 2rem; }
.about-text p { color: var(--muted); max-width: 40rem; }
.about-text p + p { margin-top: 1.1rem; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.6rem 1rem; margin-top: 2rem; }
.stat-num { font-family: var(--font-display); font-weight: 700; font-size: 2.5rem; color: var(--accent); line-height: 1; }
.stat-num small { font-size: .95rem; margin-left: 2px; vertical-align: super; }
.stat-label { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); margin-top: .4rem; }

/* ---------- Skills ---------- */
.skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .9rem; }
.skill {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1.1rem .6rem; display: flex; flex-direction: column; align-items: center; gap: .6rem;
  font-family: var(--font-mono); font-size: .86rem;
  transition: transform .2s ease, border-color .2s ease;
}
.skill:hover { transform: translateY(-3px); border-color: var(--accent); }
.skill img { width: 38px; height: 38px; object-fit: contain; }
[data-theme="dark"] .skill img.mono { filter: invert(1); }

/* ---------- Cards ---------- */
.cards { display: grid; gap: 1.2rem; }
.cards:not(.two) { max-width: 760px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow); }
.card h3 { font-size: 1.2rem; font-weight: 600; }
.card .status { font-family: var(--font-mono); font-size: .8rem; color: var(--teal-ink); margin: .2rem 0 .9rem; }
.card .desc { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }
.chip { font-family: var(--font-mono); font-size: .74rem; padding: .22rem .65rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.card-links { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.3rem; }
.link-btn {
  padding: .55rem .95rem; border-radius: 9px; border: 1px solid var(--line);
  font-size: .86rem; font-weight: 600; background: transparent;
  transition: border-color .2s ease, transform .2s ease;
}
a.link-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
.link-btn.is-disabled { color: var(--muted); cursor: not-allowed; font-weight: 500; }
.service h3 { color: var(--accent-ink); font-size: 1.1rem; margin-bottom: .45rem; }
.service p { color: var(--muted); }
.card .meta { color: var(--muted); font-size: .9rem; margin: .25rem 0 .9rem; }
.card ul { margin: 0; padding-left: 1.2rem; color: var(--muted); }
.card li + li { margin-top: .35rem; }
.card ul li::marker { color: var(--muted); }
.card.plain .meta { margin-bottom: 0; }

/* ---------- Contact ---------- */
.contact-grid { display: grid; gap: 2rem; }
.contact-info { display: grid; gap: .8rem; align-content: start; }
.contact-info p strong { font-weight: 600; }
.copy-btn {
  margin-left: .5rem; padding: .15rem .6rem; font-size: .76rem; font-family: var(--font-mono);
  border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer;
}
.copy-btn:hover { border-color: var(--accent); }
.email-text { overflow-wrap: anywhere; }
.contact-info .footer-label { margin: .8rem 0 0; }
form { display: grid; gap: .9rem; }
.field { width: 100%; padding: .85rem 1rem; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; }
.field::placeholder { color: var(--muted); opacity: .85; }
.field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
textarea.field { min-height: 140px; resize: vertical; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.send { width: 100%; padding: .95rem; font-size: 1rem; }
.send[disabled] { opacity: .65; cursor: progress; transform: none; }
.form-status { font-size: .92rem; scroll-margin-bottom: 90px; }
.form-status:not(:empty) { padding: .75rem .95rem; border: 1px solid currentColor; border-radius: 10px; background: color-mix(in srgb, currentColor 9%, transparent); }
.form-status.ok { color: var(--teal-ink); }
.form-status.err { color: #e5584f; }
.form-status a { text-decoration: underline; }

/* ---------- Footer ---------- */
.site-footer { border-top: 1px solid var(--line); padding: 2.6rem 0 1.6rem; }
.footer-name { font-family: var(--font-display); color: var(--accent); font-weight: 700; font-size: 1.6rem; margin-bottom: .8rem; }
.footer-label { font-family: var(--font-mono); font-size: .76rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 1.8rem 0 .8rem; }
.pill-row { display: flex; flex-wrap: wrap; gap: .6rem; }
.pill-link {
  display: inline-flex; align-items: center; gap: .5rem;
  padding: .42rem 1rem; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); font-size: .92rem; transition: border-color .2s ease, transform .2s ease;
}
.pill-link:hover { border-color: var(--accent); transform: translateY(-2px); }
.pill-link svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
.pill-link svg.stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pill-link svg { color: var(--teal-ink); }
.copyright { margin-top: 2rem; padding-top: 1.2rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .86rem; }

/* ---------- Scroll to top ---------- */
.to-top {
  position: fixed; right: 18px; bottom: 18px; z-index: 40;
  width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--accent-btn); color: var(--accent-btn-text);
  display: grid; place-items: center; box-shadow: var(--shadow);
  opacity: 0; transform: translateY(12px); pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}
.to-top.show { opacity: 1; transform: none; pointer-events: auto; }
.to-top svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Scroll reveal ---------- */
.js .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s ease; }
.js .reveal.in { opacity: 1; transform: none; }

.noscript { padding: 2rem 20px; text-align: center; }

/* ---------- Desktop ---------- */
@media (min-width: 768px) {
  .skills-grid { grid-template-columns: repeat(4, 1fr); }
  .cards.two { grid-template-columns: repeat(2, 1fr); }
  .stats { grid-template-columns: repeat(3, auto); justify-content: start; gap: 3rem; }
  .contact-grid { grid-template-columns: 1fr 1.2fr; gap: 3rem; }
}
@media (min-width: 900px) {
  .menu-btn { display: none; }
  .nav { position: static; display: flex; flex-direction: row; gap: 1.8rem; padding: 0; background: transparent; border: 0; }
  .nav a { padding: 0; border: 0; font-size: .95rem; }
  .header-inner { gap: 1.5rem; }
  .hero-grid { grid-template-columns: 1.15fr .85fr; text-align: left; justify-items: stretch; gap: 3rem; }
  .hero-copy { align-items: flex-start; }
  .hero-actions { flex-direction: row; flex-wrap: wrap; justify-content: flex-start; }
  .hero-photo { justify-self: center; width: min(100%, 360px); }
}
@media (min-width: 1024px) {
  .skills-grid { grid-template-columns: repeat(5, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }

  setHero(photoReveal, C.heroImages.reveal, FB.reveal);

  /* ---------- Navigation ---------- */
  var NAV = [['Home', '#home'], ['About', '#about'], ['Skills', '#skills'], ['Projects', '#projects'], ['Contact', '#contact']];
  var nav = $('#nav'), menuBtn = $('#menuBtn');
  NAV.forEach(function (n) { nav.append(el('a', { href: n[1], text: n[0] })); });
  function setMenu(open) {
    nav.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', String(open));
    menuBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  }
  menuBtn.addEventListener('click', function () { setMenu(!nav.classList.contains('open')); });
  nav.addEventListener('click', function (e) { if (e.target.closest('a')) setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setMenu(false); });
  document.addEventListener('click', function (e) {
    if (nav.classList.contains('open') && !e.target.closest('.site-header')) setMenu(false);
  });

  /* ---------- Theme ---------- */
  var root = document.documentElement, themeBtn = $('#themeBtn');
  function syncThemeLabel() {
    var dark = root.getAttribute('data-theme') === 'dark';
    themeBtn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#0c1226' : '#f6f4ec');
  }
  themeBtn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    syncThemeLabel();
  });
  syncThemeLabel();

  /* ---------- Typing effect ---------- */
  (function typeRoles() {
    var out = $('#typed'), roles = C.roles, i = 0, j = 0, deleting = false;
    if (!roles || !roles.length) return;
    if (reduceMotion) { out.textContent = roles[0]; return; }
    function tick() {
      var word = roles[i];
      out.textContent = word.slice(0, j);
      if (!deleting && j === word.length) { deleting = true; return setTimeout(tick, 1500); }
      if (deleting && j === 0) { deleting = false; i = (i + 1) % roles.length; return setTimeout(tick, 350); }
      j += deleting ? -1 : 1;
      setTimeout(tick, deleting ? 40 : 85);
    }
    tick();
  })();

  /* ---------- Hero cursor-reveal ---------- */
  (function heroReveal() {
    var box = $('#heroPhoto');
    function move(e) {
      var r = box.getBoundingClientRect();
      box.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      box.style.setProperty('--my', (e.clientY - r.top) + 'px');
    }
    box.addEventListener('pointerenter', function (e) { move(e); box.classList.add('is-active'); });
    box.addEventListener('pointermove', function (e) { move(e); box.classList.add('is-active'); });
    box.addEventListener('pointerdown', function (e) { move(e); box.classList.add('is-active'); });
    ['pointerleave', 'pointerup', 'pointercancel'].forEach(function (ev) {
      box.addEventListener(ev, function () { box.classList.remove('is-active'); });
    });
  })();

  /* ---------- About ---------- */
  $('#aboutTitle').textContent = C.about.heading;
  C.about.paragraphs.forEach(function (p) { $('#aboutText').append(el('p', { text: p })); });
  C.about.stats.forEach(function (s) {
    var num = el('span', { 'data-count': s.value, text: '0' });
    var item = el('div', { class: 'stat reveal' },
      el('div', { class: 'stat-num' }, num, s.suffix ? el('small', { text: s.suffix }) : null),
      el('div', { class: 'stat-label', text: s.label }));
    $('#stats').append(item);
  });

  /* ---------- Skills ---------- */
  C.skills.forEach(function (s) {
    var img = el('img', { src: ICON_BASE + s.icon, alt: '', width: 38, height: 38, loading: 'lazy', class: s.mono ? 'mono' : '' });
    img.addEventListener('error', function () { img.style.visibility = 'hidden'; });
    $('#skillsGrid').append(el('div', { class: 'skill reveal' }, img, el('span', { text: s.name })));
  });

  /* ---------- Projects ---------- */
  function linkButton(l) {
    if (l.url) return el('a', { class: 'link-btn', href: l.url, target: '_blank', rel: 'noopener noreferrer', text: l.label });
    return el('span', { class: 'link-btn is-disabled', 'aria-disabled': 'true', text: l.label + ' (coming soon)' });
  }
  C.projects.forEach(function (p) {
    var card = el('article', { class: 'card reveal' },
      el('h3', { text: p.title }),
      el('p', { class: 'status', text: p.status }),
      el('p', { class: 'desc', text: p.description }),
      p.tech && p.tech.length ? el('div', { class: 'chips' }, p.tech.map(function (t) { return el('span', { class: 'chip', text: t }); })) : null,
      el('div', { class: 'card-links' }, p.links.map(linkButton)));
    $('#projectCards').append(card);
  });

  /* ---------- Services ---------- */
  C.services.forEach(function (s) {
    $('#serviceCards').append(el('article', { class: 'card service reveal' }, el('h3', { text: s.title }), el('p', { text: s.text })));
  });

  /* ---------- Leadership ---------- */
  C.leadership.forEach(function (l) {
    $('#leadershipCards').append(el('article', { class: 'card reveal' },
      el('h3', { text: l.title }),
      el('p', { class: 'meta', text: l.meta }),
      el('ul', {}, l.bullets.map(function (b) { return el('li', { text: b }); }))));
  });

  /* ---------- Certifications ---------- */
  $('#certTitle').textContent = C.certifications.heading;
  C.certifications.items.forEach(function (c) {
    $('#certCards').append(el('article', { class: 'card plain reveal' }, el('h3', { text: c.title }), el('p', { class: 'meta', text: c.meta })));
  });

  /* ---------- Social links (used in Contact and Footer) ---------- */
  function socialLink(label, href, icon, stroke, extra) {
    var a = el('a', Object.assign({ class: 'pill-link', href: href }, extra || {}));
    a.append(svg(ICONS[icon], stroke ? 'stroke' : ''), document.createTextNode(label));
    return a;
  }
  function buildSocials(container) {
    var ext = { target: '_blank', rel: 'noopener noreferrer' };
    if (C.social.github) container.append(socialLink('GitHub', C.social.github, 'github', false, ext));
    if (C.social.linkedin) container.append(socialLink('LinkedIn', C.social.linkedin, 'linkedin', false, ext));
    if (C.contact.whatsapp) container.append(socialLink('WhatsApp', 'https://wa.me/' + String(C.contact.whatsapp).replace(/\D/g, ''), 'whatsapp', true, ext));
    if (C.contact.email) container.append(socialLink('Gmail', 'https://mail.google.com/mail/?view=cm&fs=1&to=' + C.contact.email, 'mail', true, ext));
  }

  /* ---------- Contact info ---------- */
  var info = $('#contactInfo');
  var copyBtn = el('button', { class: 'copy-btn', type: 'button', text: 'Copy' });
  info.append(
    el('p', { class: 'reveal' }, el('strong', { text: 'Email: ' }), el('span', { class: 'email-text', text: C.contact.email }), copyBtn),
    el('p', { class: 'reveal' }, el('strong', { text: 'Location: ' }), C.contact.location));
  var contactSocials = el('div', { class: 'pill-row reveal' });
  buildSocials(contactSocials);
  info.append(el('p', { class: 'footer-label', text: 'Connect' }), contactSocials);
  copyBtn.addEventListener('click', function () {
    function done(ok) {
      copyBtn.textContent = ok ? 'Copied' : 'Press Ctrl+C';
      setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1800);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(C.contact.email).then(function () { done(true); }, function () { done(false); });
    } else {
      var ta = el('textarea', { 'aria-hidden': 'true' });
      ta.value = C.contact.email; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.append(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove(); done(ok);
    }
  });

  /* ---------- Contact form ---------- */
  var form = $('#contactForm'), statusEl = $('#formStatus'), sendBtn = $('#sendBtn');
  function setStatus(kind, nodes) {
    statusEl.className = 'form-status ' + kind;
    statusEl.textContent = '';
    [].concat(nodes).forEach(function (n) { statusEl.append(n.nodeType ? n : document.createTextNode(n)); });
    if (kind && statusEl.scrollIntoView) statusEl.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
  }
  function sentence(t) { t = String(t || '').trim(); return /[.!?]$/.test(t) ? t : t + '.'; }
  function mailtoHref(d) {
    // A mailto: link can only fill To, Subject and Body. The "From" is always the account signed in on
    // the visitor's phone, so name and email go below the message as a signature.
    var body = d.message + '\n\n— ' + d.name + '\n' + d.email;
    return 'mailto:' + C.contact.email + '?subject=' + encodeURIComponent(d.subject) + '&body=' + encodeURIComponent(body);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = form.elements;
    var data = {
      name: f['name'].value.trim(),
      email: f['email'].value.trim(),
      subject: f['subject'].value.trim(),
      message: f['message'].value.trim(),
      website: f['website'].value
    };
    if (data.name.length < 2) return setStatus('err', 'Enter your name (at least 2 characters).');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(data.email)) return setStatus('err', 'Enter a valid email address.');
    if (data.subject.length < 3) return setStatus('err', 'Enter a subject (at least 3 characters).');
    if (data.message.length < 10) return setStatus('err', 'Write a message of at least 10 characters.');

    // Hidden field filled in = bot. Pretend it worked and send nothing.
    if (data.website) { form.reset(); return setStatus('ok', 'Message sent.'); }

    var key = (C.contact.web3formsKey || '').trim();
    var servedOverHttp = /^https?:$/.test(window.location.protocol);

    // Opened as a plain file (file:// or content://) with no Web3Forms key: there is no server,
    // so hand the message to the visitor's email app, pre-filled and ready to send.
    if (!key && !servedOverHttp) {
      setStatus('ok', 'Opening your email app with the message filled in. Tap Send there to deliver it to ' + C.contact.email + '.');
      setTimeout(function () { window.location.href = mailtoHref(data); }, 120);
      return;
    }

    var request = key
      ? fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            access_key: key,
            subject: data.subject,
            from_name: data.name,
            replyto: data.email,
            name: data.name, email: data.email, message: data.message
          })
        })
      : fetch(C.contact.apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

    sendBtn.disabled = true; sendBtn.textContent = 'Sending…'; setStatus('', '');
    request
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (body) { return { res: res, body: body }; });
      })
      .then(function (r) {
        if (r.res.ok && (r.body.ok || r.body.success)) {
          form.reset();
          setStatus('ok', 'Message sent. I’ll reply to ' + data.email + ' soon.');
        } else {
          throw new Error(r.body.error || r.body.message || 'The server could not send your message.');
        }
      })
      .catch(function (err) {
        var reason = (err instanceof TypeError)
          ? 'Couldn’t reach the server, so your message was not sent.'
          : sentence(err && err.message ? err.message : 'Message not sent.');
        var viaMail = el('a', { href: mailtoHref(data), text: 'send it from your email app' });
        setStatus('err', [reason + ' You can ', viaMail, ' instead.']);
      })
      .finally(function () { sendBtn.disabled = false; sendBtn.textContent = 'Send Message'; });
  });

  /* ---------- Footer ---------- */
  [['Home', '#home'], ['About', '#about'], ['Skills', '#skills'], ['Projects', '#projects'], ['Leadership', '#leadership'], ['Certifications', '#certifications'], ['Contact', '#contact']]
    .forEach(function (q) { $('#quickLinks').append(el('a', { class: 'pill-link', href: q[1], text: q[0] })); });
  buildSocials($('#socialLinks'));

  /* ---------- Counters ---------- */
  function countUp(node) {
    var target = Number(node.getAttribute('data-count')) || 0;
    if (reduceMotion) { node.textContent = target; return; }
    var start = null, dur = 1200;
    function step(ts) {
      if (start === null) start = ts;
      var p = Math.min((ts - start) / dur, 1);
      node.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* ---------- Scroll reveal + counters ---------- */
  var revealItems = [].slice.call(document.querySelectorAll('.reveal'));
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        en.target.classList.add('in');
        var c = en.target.querySelector('[data-count]');
        if (c) countUp(c);
        io.unobserve(en.target);
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
    revealItems.forEach(function (n) { io.observe(n); });
  } else {
    revealItems.forEach(function (n) {
      n.classList.add('in');
      var c = n.querySelector('[data-count]'); if (c) countUp(c);
    });
  }

  /* ---------- Active nav link + scroll-to-top ---------- */
  var toTop = $('#toTop');
  var spyTargets = NAV.map(function (n) { return document.querySelector(n[1]); });
  function onScroll() {
    toTop.classList.toggle('show', window.scrollY > 500);
    var y = window.scrollY + 120, current = 0;
    spyTargets.forEach(function (t, idx) { if (t && t.offsetTop <= y) current = idx; });
    [].forEach.call(nav.children, function (a, idx) { a.classList.toggle('active', idx === current); });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  toTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); });
})();
</script>
</body>
</html>
